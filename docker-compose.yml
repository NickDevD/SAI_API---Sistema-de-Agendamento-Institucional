services:
  # 1. BANCO DE DADOS
  postgres-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BACKEND
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./relatorios:/app/relatorios
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_LOGIN_LINE: ${ADMIN_LOGIN_LINE}
      ADMIN_PASSWORD_LINE: ${ADMIN_PASSWORD_LINE}
      RELATORIO_PATH: /app/relatorios
      PORT: 8080
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_LOGIN: ${DEMO_LOGIN:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_RESEED_INTERVAL_MS: ${DEMO_RESEED_INTERVAL_MS:-120000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    restart: on-failure:5
    depends_on:
      postgres-db:
        condition: service_healthy

  # 3. FRONTEND (dev mode — VITE_API_URL deve apontar para localhost pois é lida pelo navegador)
  frontend-app:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-}
      VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-}
    volumes:
      - ./front:/app
      - /app/node_modules
    # O Vite escuta o stdin para atalhos de teclado e encerra se ele fechar.
    # Sem estas duas linhas o container morre logo apos subir em `up -d`.
    stdin_open: true
    tty: true
    depends_on:
      - backend-api

volumes:
  postgres_data: